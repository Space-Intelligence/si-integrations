[project]
name = "si-integrations"
version = "0.1.0"
description = ""
requires-python = "==3.12.*"
dependencies = []
[dependency-groups]
dev = [
  "pytest>=9.0.0,<10.0.0",
  "pytest-cov>=6.0.0,<7.0.0",
  "ruff>=0.9.2,<1.0.0",
]
[tool.ruff]
target-version = "py312"
[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S"]
[tool.pytest.ini_options]
testpaths = ["tests"]
